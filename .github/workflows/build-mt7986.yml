name: Build ImmortalWrt MT7981 AX3000T

permissions:
  contents: write
  
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04   # 指定 Ubuntu 22.04

    env:
      TARGET: mediatek
      SUBTARGET: filogic
      PROFILE: Xiaomi AX3000T  # 根据你的设备修改

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo bash -c 'bash <(curl -s https://build-scripts.immortalwrt.org/init_build_environment.sh)'

      - name: Clone ImmortalWrt MT798x source
        run: |
          git clone -b openwrt-24.10-6.6 --single-branch --filter=blob:none \
              https://github.com/padavanonly/immortalwrt-mt798x-24.10 openwrt-src

      - name: Update and install feeds
        run: |
          cd openwrt-src
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Copy custom config
        run: |
          cd openwrt-src
          cp -f defconfig/mt7981-ax3000.config .config
          cp $GITHUB_WORKSPACE/.github/workflows/.config .config
          make defconfig
          
      - name: Fix libffi Makefile path
        run: |
          cd openwrt-src
          if [ -f feeds/packages/libs/libffi/Makefile ]; then
            sed -i 's/\$(GNU_TARGET_NAME)\*\/fficonfig.h/\*\/fficonfig.h/g' feeds/packages/libs/libffi/Makefile
            echo "libffi Makefile fixed."
          else
            echo "Warning: libffi Makefile not found, skipping fix."
          fi
          
      - name: Compile ImmortalWrt
        run: |
          cd openwrt-src
          make download -j8
          make -j1 V=s
          
      - name: Upload compiled firmware
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-mt7981
          path: openwrt-src/bin/targets/mediatek/filogic/

      - name: Upload firmware to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: openwrt-${{ github.run_number }}
          name: OpenWrt Build ${{ github.run_number }}
          files: |
            openwrt/bin/targets/*/*/*.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
