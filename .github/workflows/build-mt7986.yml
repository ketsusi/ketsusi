name: Build ImmortalWrt MT7986

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04   # 指定 Ubuntu 22.04

    env:
      TARGET: mediatek
      SUBTARGET: mediatek_filogic
      PROFILE: jdcloud_re-cp-03  # 根据你的设备修改

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt full-upgrade -y
          sudo apt install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison \
            build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar \
            flex gawk gettext gcc-multilib g++-multilib git gnutls-dev gperf haveged help2man \
            intltool lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev \
            libmpc-dev libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev libtool \
            libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full \
            patch pkgconf python3 python3-pip python3-ply python3-docutils python3-pyelftools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl \
            unzip vim wget xmlto xxd zlib1g-dev zstd

      - name: Clone ImmortalWrt MT798x source
        run: |
          git clone -b openwrt-24.10-6.6 --single-branch --filter=blob:none \
              https://github.com/padavanonly/immortalwrt-mt798x-24.10 openwrt-src

      - name: Update and install feeds
        run: |
          cd openwrt-src
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Copy custom config
        run: |
          cp .github/workflows/.config openwrt-src/.config
          cd openwrt-src
          make defconfig

      - name: Compile ImmortalWrt
        run: |
          cd openwrt-src
          make -j1 V=s
      - name: Upload compiled firmware
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-firmware
          path: openwrt-src/bin/targets/${{ env.TARGET }}/${{ env.SUBTARGET }}/
